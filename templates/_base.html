<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{% block title %}BabyCare 配置{% endblock %}</title>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container">
    <a class="navbar-brand" href="/">BabyCare</a>
    <ul class="navbar-nav flex-row gap-3">
      <li class="nav-item"><a class="nav-link{% if request.path == "/" %} active{% endif %}" href="/">首页</a></li>
      <li class="nav-item"><a class="nav-link{% if '/config/prompts' in request.path %} active{% endif %}" href="/config/prompts/">VLM 检查项</a></li>
      <li class="nav-item"><a class="nav-link{% if '/config/cameras' in request.path %} active{% endif %}" href="{% url 'config_panel:camera_list' %}">摄像头配置</a></li>
      <li class="nav-item"><a class="nav-link{% if '/config/notify-targets' in request.path %} active{% endif %}" href="{% url 'config_panel:notify_targets_list' %}">通知目标</a></li>
      <li class="nav-item"><a class="nav-link{% if '/events' in request.path %} active{% endif %}" href="/events/">事件</a></li>
      <li class="nav-item"><a class="nav-link{% if '/vlm-control' in request.path %} active{% endif %}" href="{% url 'dashboard:vlm_control' %}">VLM 控制</a></li>
      <li class="nav-item"><a class="nav-link{% if '/audio-control' in request.path %} active{% endif %}" href="{% url 'dashboard:audio_control' %}">音频控制</a></li>
      <li class="nav-item"><a class="nav-link{% if '/sound-detection' in request.path or '/sound-events' in request.path %} active{% endif %}" href="{% url 'dashboard:sound_detection_logs' %}">声音检测</a></li>
      <li class="nav-item"><a class="nav-link" href="/healthz">健康检查</a></li>
    </ul>
  </div>
</nav>
<main class="container">
  {% if messages %}{% for m in messages %}
    <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
  {% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
